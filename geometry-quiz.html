<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何维度 · 立体几何测试</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --text: #e4e4ec;
    --text-secondary: #8888a0;
    --accent: #6366f1;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --radius: 12px;
  }
  [data-theme="light"] {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --border: #e2e2ea;
    --text: #1a1a2e;
    --text-secondary: #6b6b80;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  .header {
    width: 100%; max-width: 900px; padding: 24px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo svg { width: 28px; height: 28px; stroke: var(--accent); }
  .theme-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: .2s;
  }
  .theme-btn:hover { border-color: var(--accent); }
  .container { width: 100%; max-width: 900px; padding: 0 20px 60px; }

  /* Start Screen */
  .start-screen { text-align: center; padding: 60px 20px; }
  .start-screen h1 { font-size: 36px; margin-bottom: 12px; }
  .start-screen p { color: var(--text-secondary); margin-bottom: 32px; font-size: 16px; }
  .difficulty-select { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .diff-btn {
    padding: 14px 28px; border-radius: var(--radius); border: 2px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 15px;
    font-family: inherit; transition: .2s; min-width: 100px;
  }
  .diff-btn:hover, .diff-btn.active { border-color: var(--accent); background: rgba(99,102,241,0.08); }
  .diff-btn.active { box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .diff-label { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .start-btn {
    padding: 16px 56px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: .2s;
  }
  .start-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Quiz */
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .progress-text { font-size: 14px; color: var(--text-secondary); }
  .progress-bar {
    width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 32px;
  }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .timer {
    font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .timer.warning { color: var(--warning); border-color: var(--warning); }
  .timer.danger { color: var(--danger); border-color: var(--danger); animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }
  .score-display { font-size: 14px; color: var(--success); font-weight: 600; }

  .question-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; margin-bottom: 20px;
  }
  .question-type {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; margin-bottom: 12px;
    background: rgba(99,102,241,0.1); color: var(--accent);
  }
  .question-text { font-size: 18px; font-weight: 600; line-height: 1.6; margin-bottom: 24px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 14px 18px; border-radius: var(--radius); border: 2px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: 15px; font-family: inherit; text-align: left; transition: .15s;
    display: flex; align-items: center; gap: 12px;
  }
  .option:hover:not(.disabled) { border-color: var(--accent); background: rgba(99,102,241,0.04); }
  .option.correct { border-color: var(--success); background: rgba(34,197,94,0.08); }
  .option.wrong { border-color: var(--danger); background: rgba(239,68,68,0.08); }
  .option.disabled { cursor: not-allowed; opacity: 0.7; }
  .option-letter {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .option.correct .option-letter { border-color: var(--success); background: var(--success); color: #fff; }
  .option.wrong .option-letter { border-color: var(--danger); background: var(--danger); color: #fff; }

  .explanation {
    margin-top: 20px; padding: 16px; border-radius: var(--radius);
    background: rgba(99,102,241,0.05); border: 1px solid rgba(99,102,241,0.15);
    font-size: 14px; line-height: 1.7; color: var(--text-secondary);
  }
  .explanation strong { color: var(--text); }
  .next-btn {
    margin-top: 20px; padding: 12px 36px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; float: right; transition: .2s;
  }
  .next-btn:hover { opacity: 0.9; }

  /* Result */
  .result-screen { text-align: center; padding: 40px 20px; }
  .result-score { font-size: 72px; font-weight: 800; margin-bottom: 8px; }
  .result-score.perfect { color: var(--success); }
  .result-score.good { color: var(--accent); }
  .result-score.ok { color: var(--warning); }
  .result-score.bad { color: var(--danger); }
  .result-label { font-size: 16px; color: var(--text-secondary); margin-bottom: 32px; }
  .result-stats {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px;
  }
  .stat-card {
    padding: 20px 28px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); min-width: 100px;
  }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .retry-btn {
    padding: 14px 44px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: .2s;
  }
  .retry-btn:hover { opacity: 0.9; }

  /* 3D mini preview */
  .preview-canvas { width: 100%; height: 200px; border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; background: var(--bg); }

  @media (max-width: 600px) {
    .start-screen h1 { font-size: 26px; }
    .question-text { font-size: 16px; }
    .option { font-size: 14px; padding: 12px 14px; }
    .result-score { font-size: 52px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
      <line x1="12" y1="22" x2="12" y2="15.5"/>
      <polyline points="22 8.5 12 15.5 2 8.5"/>
    </svg>
    几何维度
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌓</button>
</div>

<div class="container" id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Question Bank ──
const ALL_QUESTIONS = [
  // ═══ 正方体 ═══
  { id:1, type:'体积', geo:'cube', geoLabel:'正方体', diff:'easy',
    text:'正方体的棱长为 3，它的体积是多少？',

    explain:'正方体体积 V = a³ = 3³ = 27' },

    options:['48','64','96','128'], answer:2,
    explain:'正方体表面积 S = 6a² = 6×16 = 96' },
  { id:3, type:'体对角线', geo:'cube', geoLabel:'正方体', diff:'medium',
    text:'正方体的棱长为 2，它的体对角线长度是多少？',
    options:['2√2','2√3','4','4√2'], answer:1,

  { id:4, type:'面对角线', geo:'cube', geoLabel:'正方体', diff:'medium',
    text:'正方体棱长为 a，一个面的对角线长度是多少？',
    options:['a','a√2','a√3','2a'], answer:1,
    explain:'正方形对角线 = a√2' },
  { id:5, type:'体积', geo:'cube', geoLabel:'正方体', diff:'medium',
    text:'正方体表面积为 54，它的体积是多少？',
    options:['9','18','27','36'], answer:2,
    explain:'6a²=54 → a²=9 → a=3 → V=27' },

  // ═══ 长方体 ═══
  { id:6, type:'体积', geo:'cuboid', geoLabel:'长方体', diff:'easy',
    text:'长方体长 4、宽 3、高 2，体积是多少？',
    options:['12','20','24','36'], answer:2,
    explain:'长方体体积 V = abc = 4×3×2 = 24' },
  { id:7, type:'表面积', geo:'cuboid', geoLabel:'长方体', diff:'medium',
    text:'长方体长 5、宽 4、高 3，表面积是多少？',
    options:['60','74','84','94'], answer:3,
    explain:'S = 2(ab+bc+ac) = 2(20+12+15) = 94' },
  { id:8, type:'体对角线', geo:'cuboid', geoLabel:'长方体', diff:'hard',
    text:'长方体长 6、宽 3、高 2，体对角线长度是多少？',
    options:['7','8','9','11'], answer:0,
    explain:'d = √(a²+b²+c²) = √(36+9+4) = √49 = 7' },

  // ═══ 圆柱 ═══
  { id:9, type:'体积', geo:'cylinder', geoLabel:'圆柱', diff:'easy',
    text:'圆柱底面半径 2，高 5，体积是多少？（π≈3.14）',
    options:['31.4','62.8','94.2','125.6'], answer:1,
    explain:'V = πr²h = 3.14×4×5 = 62.8' },
  { id:10, type:'侧面积', geo:'cylinder', geoLabel:'圆柱', diff:'medium',
    text:'圆柱底面半径 3，高 10，侧面积是多少？（π≈3.14）',
    options:['94.2','141.3','188.4','282.6'], answer:2,
    explain:'侧面积 S = 2πrh = 2×3.14×3×10 = 188.4' },
  { id:11, type:'表面积', geo:'cylinder', geoLabel:'圆柱', diff:'hard',
    text:'圆柱底面半径 2，高 6，全面积是多少？（π≈3.14）',
    options:['75.36','87.92','100.48','125.6'], answer:2,
    explain:'S = 2πr² + 2πrh = 25.12 + 75.36 = 100.48' },

  // ═══ 圆锥 ═══
  { id:12, type:'体积', geo:'cone', geoLabel:'圆锥', diff:'medium',
    text:'圆锥底面半径 3，高 4，体积是多少？（π≈3.14）',
    options:['25.12','37.68','50.24','75.36'], answer:1,
    explain:'V = ⅓πr²h = (1/3)×3.14×9×4 = 37.68' },
  { id:13, type:'母线', geo:'cone', geoLabel:'圆锥', diff:'medium',
    text:'圆锥底面半径 3，高 4，母线长是多少？',
    options:['4','5','6','7'], answer:1,
    explain:'母线 l = √(r²+h²) = √(9+16) = 5' },
  { id:14, type:'侧面积', geo:'cone', geoLabel:'圆锥', diff:'hard',
    text:'圆锥底面半径 3，母线长 5，侧面积是多少？（π≈3.14）',
    options:['31.4','47.1','62.8','78.5'], answer:1,
    explain:'侧面积 = πrl = 3.14×3×5 = 47.1' },

  // ═══ 球体 ═══
  { id:15, type:'体积', geo:'sphere', geoLabel:'球体', diff:'easy',
    text:'球体半径 3，体积是多少？（π≈3.14）',
    options:['84.78','94.2','113.04','150.72'], answer:2,
    explain:'V = (4/3)πr³ = (4/3)×3.14×27 = 113.04' },
  { id:16, type:'表面积', geo:'sphere', geoLabel:'球体', diff:'medium',
    text:'球体半径 5，表面积是多少？（π≈3.14）',
    options:['157','235.5','314','628'], answer:2,
    explain:'S = 4πr² = 4×3.14×25 = 314' },
  { id:17, type:'截面', geo:'sphere', geoLabel:'球体', diff:'hard',
    text:'球体半径 5，在距球心 3 处做截面，截面圆半径是多少？',
    options:['2','3','4','5'], answer:2,
    explain:'截面半径 r\' = √(R²-d²) = √(25-9) = 4' },

  // ═══ 棱锥 ═══
  { id:18, type:'体积', geo:'pyramid', geoLabel:'正四棱锥', diff:'medium',
    text:'正四棱锥底面边长 4，高 6，体积是多少？',
    options:['16','24','32','48'], answer:2,
    explain:'V = ⅓a²h = (1/3)×16×6 = 32' },
  { id:19, type:'斜高', geo:'pyramid', geoLabel:'正四棱锥', diff:'hard',
    text:'正四棱锥底面边长 6，高 4，侧面三角形斜高是多少？',
    options:['4','5','6','7'], answer:1,
    explain:'斜高 l = √(h²+(a/2)²) = √(16+9) = 5' },

  // ═══ 棱柱 ═══
  { id:20, type:'体积', geo:'prism', geoLabel:'正三棱柱', diff:'medium',
    text:'正三棱柱底面边长 4，高 8，底面积约为多少？（√3≈1.73）',
    options:['3.46','5.19','6.92','13.84'], answer:2,
    explain:'正三角形面积 = (√3/4)a² = 1.73×16/4 = 6.92' },
  { id:21, type:'体积', geo:'prism', geoLabel:'正三棱柱', diff:'hard',
    text:'正三棱柱底面边长 4，高 8，体积约为多少？（√3≈1.73）',
    options:['27.68','41.52','55.36','83.04'], answer:2,
    explain:'V = S底×h = 6.92×8 = 55.36' },

  // ═══ 棱台 ═══
  { id:22, type:'体积', geo:'frustum', geoLabel:'正四棱台', diff:'hard',
    text:'正四棱台上底边长 2，下底边长 4，高 3，体积是多少？',
    options:['14','20','28','36'], answer:2,
    explain:'V = h/3·(S₁+S₂+√(S₁S₂)) = 3/3×(4+16+√64) = 28' },

  // ═══ 综合/角度 ═══
  { id:23, type:'异面直线角', geo:'cube', geoLabel:'正方体', diff:'hard',
    text:'正方体 ABCD-EFGH 中，AB 与 B\'D 的夹角是？(B\'=F)',
    options:['30°','45°','60°','90°'], answer:2,
    explain:'AB∥EF，B\'D=FD，EF与FD夹角60°（等边三角形EFD）→ 异面直线角=60°' },
  { id:24, type:'线面角', geo:'cube', geoLabel:'正方体', diff:'hard',
    text:'正方体中，体对角线 BD\' 与底面 ABCD 的夹角正弦值为？',
    options:['1/3','1/2','2/3','√3/3'], answer:3,
    explain:'sinθ = h/d = a/(a√3) = √3/3' },
];

// ── State ──
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let timerInterval = null;
let timeLeft = 0;
let startTime = 0;

// ── Theme ──
window.toggleTheme = function() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('geo-quiz-theme', next);
};

// ── Init ──
const saved = localStorage.getItem('geo-quiz-theme');
if (saved) document.documentElement.dataset.theme = saved;

const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(difficulty) {
  let pool;
  if (difficulty === 'easy') pool = ALL_QUESTIONS.filter(q => q.diff === 'easy');
  else if (difficulty === 'hard') pool = ALL_QUESTIONS.filter(q => q.diff === 'hard' || q.diff === 'medium');
  else pool = [...ALL_QUESTIONS];

  questions = shuffle(pool).slice(0, 10);
  currentIndex = 0;
  score = 0;
  answered = false;
  startTime = Date.now();
  renderQuiz();
}

function renderQuiz() {
  if (currentIndex >= questions.length) { renderResult(); return; }
  answered = false;
  const q = questions[currentIndex];
  const pct = ((currentIndex) / questions.length) * 100;
  timeLeft = q.diff === 'hard' ? 90 : q.diff === 'medium' ? 60 : 30;
  updateTimer();

  app.innerHTML = `
    <div class="quiz-header">
      <span class="progress-text">第 ${currentIndex + 1} / ${questions.length} 题</span>
      <span class="score-display">✓ ${score}</span>
      <span class="timer" id="timerDisplay">${formatTime(timeLeft)}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question-card">
      <span class="question-type">${q.type} · ${q.geoLabel}</span>
      <div class="preview-canvas" id="preview3d"></div>
      <div class="question-text">${q.text}</div>
      <div class="options" id="optionsContainer"></div>
      <div class="explanation" id="explanation" style="display:none"></div>
      <button class="next-btn" id="nextBtn" style="display:none" onclick="nextQuestion()">
        ${currentIndex < questions.length - 1 ? '下一题 →' : '查看结果'}
      </button>
    </div>
  `;

  // Render options
  const letters = ['A','B','C','D'];
  const optsDiv = document.getElementById('optionsContainer');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i);
    optsDiv.appendChild(btn);
  });

  // Start timer
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) selectAnswer(-1);
    }
  }, 1000);

  // 3D preview
  initPreview(q.geo);
}

function updateTimer() {
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  el.textContent = formatTime(timeLeft);
  el.className = 'timer';
  if (timeLeft <= 10) el.classList.add('danger');
  else if (timeLeft <= 20) el.classList.add('warning');
}

function formatTime(s) { const m = Math.floor(s/60); const sec = s%60; return `${m}:${String(sec).padStart(2,'0')}`; }

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = questions[currentIndex];
  const correct = index === q.answer;
  if (correct) score++;

  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) btn.classList.add('correct');
    if (i === index && !correct) btn.classList.add('wrong');
  });

  const expl = document.getElementById('explanation');
  expl.style.display = 'block';
  expl.innerHTML = correct
    ? `<strong>✓ 正确！</strong> ${q.explain}`
    : `<strong>✗ 错误</strong>（正确答案：${['A','B','C','D'][q.answer]}）<br>${q.explain}`;

  document.getElementById('nextBtn').style.display = 'inline-block';
}

window.nextQuestion = function() {
  currentIndex++;
  renderQuiz();
};

function renderResult() {
  clearInterval(timerInterval);
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  let cls = 'bad', label = '继续加油！';
  if (pct >= 90) { cls = 'perfect'; label = '太厉害了！🎉'; }
  else if (pct >= 70) { cls = 'good'; label = '很不错！'; }
  else if (pct >= 50) { cls = 'ok'; label = '还可以，再练练！'; }

  app.innerHTML = `
    <div class="result-screen">
      <div class="result-score ${cls}">${pct}分</div>
      <div class="result-label">${label}</div>
      <div class="result-stats">
        <div class="stat-card">
          <div class="stat-value" style="color:var(--success)">${score}</div>
          <div class="stat-label">正确</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color:var(--danger)">${total - score}</div>
          <div class="stat-label">错误</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${formatTime(elapsed)}</div>
          <div class="stat-label">用时</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${total}</div>
          <div class="stat-label">总题数</div>
        </div>
      </div>
      <button class="retry-btn" onclick="renderStart()">再来一次</button>
    </div>
  `;
}

// ── Start Screen ──
window.renderStart = function() {
  clearInterval(timerInterval);
  app.innerHTML = `
    <div class="start-screen">
      <h1>立体几何测试</h1>
      <p>选择难度，开始 10 道随机题目</p>
      <div class="difficulty-select">
        <button class="diff-btn active" onclick="startQuiz('all');updateDiffBtns(this)">
          全部<span class="diff-label">24 题随机</span>
        </button>
        <button class="diff-btn" onclick="startQuiz('easy');updateDiffBtns(this)">
          基础<span class="diff-label">基础公式</span>
        </button>
        <button class="diff-btn" onclick="startQuiz('hard');updateDiffBtns(this)">
          进阶<span class="diff-label">推理 + 技巧</span>
        </button>
      </div>
      <button class="start-btn" onclick="startQuiz('all')">开始测试</button>
    </div>
  `;
};

window.updateDiffBtns = function(btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
};

// ── 3D Preview ──
const previewScenes = new Map();

function initPreview(geoType) {
  const container = document.getElementById('preview3d');
  if (!container) return;

  // Cleanup old
  const oldKey = container.dataset.sceneKey;
  if (oldKey && previewScenes.has(oldKey)) {
    const old = previewScenes.get(oldKey);
    old.controls.dispose();
    old.renderer.dispose();
    old.renderer.domElement.remove();
    previewScenes.delete(oldKey);
  }

  const key = `${geoType}-${Date.now()}`;
  container.dataset.sceneKey = key;

  const w = container.clientWidth;
  const h = container.clientHeight;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(4, 3, 5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.enableZoom = false;

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5, 10, 5);
  scene.add(dir);

  // Grid
  const grid = new THREE.GridHelper(8, 8, 0x444466, 0x222244);
  scene.add(grid);

  // Geometry
  let mesh;
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x6366f1,
    metalness: 0.05,
    roughness: 0.3,
    transparent: true,
    opacity: 0.85,
  });
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xa5b4fc, transparent: true, opacity: 0.5 });

  switch (geoType) {
    case 'cube': {
      const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      break;
    }
    case 'cuboid': {
      const geo = new THREE.BoxGeometry(2, 1.2, 1.6);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      break;
    }
    case 'cylinder': {
      const geo = new THREE.CylinderGeometry(0.8, 0.8, 2, 48);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      break;
    }
    case 'cone': {
      const geo = new THREE.ConeGeometry(0.8, 2, 48);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      break;
    }
    case 'sphere': {
      const geo = new THREE.SphereGeometry(1, 48, 32);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo, 15);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      break;
    }
    case 'pyramid': {
      const geo = new THREE.ConeGeometry(1, 1.6, 4, 1);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      mesh.rotation.y = Math.PI / 4;
      break;
    }
    case 'prism': {
      const shape = new THREE.Shape();
      const r = 0.8;
      shape.moveTo(r * Math.cos(0), r * Math.sin(0));
      for (let i = 1; i < 3; i++) shape.lineTo(r * Math.cos(i * 2*Math.PI/3), r * Math.sin(i * 2*Math.PI/3));
      shape.closePath();
      const extrudeSettings = { steps: 1, depth: 2, bevelEnabled: false };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.translate(0, 0, -1);
      geo.rotateX(-Math.PI/2);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      break;
    }
    case 'frustum': {
      const geo = new THREE.CylinderGeometry(0.5, 0.9, 1.6, 4, 1);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
      mesh.rotation.y = Math.PI / 4;
      break;
    }
    default: {
      const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
      mesh = new THREE.Mesh(geo, mat);
      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));
    }
  }

  scene.add(mesh);

  function animate() {
    const entry = previewScenes.get(key);
    if (!entry) return;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  previewScenes.set(key, { scene, camera, renderer, controls, mesh });
  animate();

  // Resize observer
  const ro = new ResizeObserver(() => {
    const entry = previewScenes.get(key);
    if (!entry) return;
    const w2 = container.clientWidth;
    const h2 = container.clientHeight;
    entry.camera.aspect = w2 / h2;
    entry.camera.updateProjectionMatrix();
    entry.renderer.setSize(w2, h2);
  });
  ro.observe(container);
}

// ── Start ──
renderStart();
</script>
</body>
</html>
